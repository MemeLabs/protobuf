on:
  push:
    tags:
      - "v*"

name: Create Release

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      - name: Build protoc plugins
        run: |
          VER="${TAG#v}"
          OUT="protoc-plugins-$VER"

          mkdir "$OUT" assets

          create_asset() {
            rm -rf "${OUT:?}"/*
            for PLUGIN in ts gorpc tsrpc; do
              GOOS=$1 GOARCH=$2 go build -trimpath -o "$OUT/protoc-gen-$PLUGIN$3" "./cmd/$PLUGIN/"
            done
          }

          create_asset_tgz() {
            create_asset "$2" "$3" "$4"
            tar -czf "assets/$OUT-$1.tar.gz" "$OUT"
          }

          create_asset_zip() {
            create_asset "$2" "$3" "$4"
            zip -r "assets/$OUT-$1.zip" "$OUT"
          }

          create_asset_tgz "linux-x86_64" "linux" "amd64"
          create_asset_tgz "linux-x86_32" "linux" "386"
          create_asset_tgz "osx-x86_64" "darwin" "amd64"
          create_asset_tgz "osx-arm64" "darwin" "arm64"
          create_asset_zip "win64" "windows" "amd64" ".exe"
          create_asset_zip "win32" "windows" "386" ".exe"
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: "0"
      - uses: JS-DevTools/npm-publish@v4
        with:
          access: public
      - name: Release protoc plugins
        run: gh release create "$TAG" assets/* --title "protobuf $TAG" --notes ""
        env:
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
